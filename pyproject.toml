[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bi-governance-lab"
version = "0.1.0"
description = "A local enterprise BI governance simulation and evaluation lab."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pandas>=2.2,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "streamlit>=1.40,<2.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.0,<3.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
bi-governance-seed = "bi_governance_lab.seed:main"
bi-governance-rules = "bi_governance_lab.rules:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bi_governance_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
